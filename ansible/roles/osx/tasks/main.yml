---
- name: Install zsh
  homebrew:
    name: zsh

- name: Install bash
  homebrew:
    name: bash

- lineinfile:
    path: /etc/shells
    line: /usr/local/bin/zsh
  become: true
  when: ansible_facts['machine'] == 'x86_64'

- lineinfile:
    path: /etc/shells
    line: /opt/homebrew/bin/zsh
  become: true
  when: ansible_facts['machine'] == 'aarch64'

- user:
    name: "{{ ansible_facts.user_id }}"
    create_home: no
    shell: /usr/local/bin/zsh
    update_password: on_create
  become: true
  when: ansible_facts['machine'] == 'x86_64'

- user:
    name: "{{ ansible_facts.user_id }}"
    create_home: no
    shell: /opt/homebrew/bin/zsh
    update_password: on_create
  become: true
  when: ansible_facts['machine'] == 'aarch64'

- homebrew_tap:
    name: thoughtbot/formulae

- homebrew:
    name: rcm

- homebrew:
    name: fzf

- homebrew:
    name: hub

- homebrew:
    name: neovim

- homebrew:
    name: coreutils

- homebrew:
    name: gpg2

- stat:
    path: "/Applications/Google Chrome.app"
  register: CHROME_APP_DIR

- name: Install Google Chrome
  homebrew_cask:
    name: google-chrome
  when: CHROME_APP_DIR.stat.exists == false

- name: Install iTerm2
  homebrew_cask:
    name: iterm2

- name: Install Jetbrains Toolbox
  homebrew_cask:
    name: jetbrains-toolbox

- name: Install VS Code
  homebrew_cask:
    name: visual-studio-code

- stat:
    path: "/Applications/Divvy.app"
  register: DIVVY_APP_DIR

- name: Install divvy
  homebrew_cask:
    name: divvy
  when: DIVVY_APP_DIR.stat.exists == false

- import_tasks: docker.yml
