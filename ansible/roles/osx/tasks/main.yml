---
- name: Install zsh
  homebrew:
    name: zsh

- name: Install bash
  homebrew:
    name: bash

- lineinfile:
    path: /etc/shells
    line: /usr/local/bin/zsh
  become: true
  when: ansible_facts['machine'] == 'x86_64'

- lineinfile:
    path: /etc/shells
    line: /opt/homebrew/bin/zsh
  become: true
  when: ansible_facts['machine'] == 'aarch64'

- user:
    name: "{{ ansible_facts.user_id }}"
    create_home: no
    shell: /usr/local/bin/zsh
    update_password: on_create
  become: true
  when: ansible_facts['machine'] == 'x86_64'

- user:
    name: "{{ ansible_facts.user_id }}"
    create_home: no
    shell: /opt/homebrew/bin/zsh
    update_password: on_create
  become: true
  when: ansible_facts['machine'] == 'aarch64'

- homebrew_tap:
    name: thoughtbot/formulae
    trust: true

- homebrew:
    name: rcm

- homebrew:
    name: fzf

- homebrew:
    name: direnv

- homebrew:
    name: hub

- homebrew:
    name: gh

- homebrew:
    name: neovim

- homebrew:
    name: coreutils

- homebrew:
    name: gpg2

- homebrew_tap:
    name: keith/formulae
    trust: true

- homebrew:
    name: keith/formulae/zap

- stat:
    path: "/Applications/Google Chrome.app"
  register: CHROME_APP_DIR

- name: Install Google Chrome
  homebrew_cask:
    name: google-chrome
  when:
    - CHROME_APP_DIR.stat.exists == false
    - not (devbox_work_mode | default(false) | bool)

- name: Install iTerm2
  homebrew_cask:
    name: iterm2
  when: not (devbox_work_mode | default(false) | bool)

- name: Install Jetbrains Toolbox
  homebrew_cask:
    name: jetbrains-toolbox
  when: not (devbox_work_mode | default(false) | bool)

- name: Install VS Code
  homebrew_cask:
    name: visual-studio-code
  when: not (devbox_work_mode | default(false) | bool)

- stat:
    path: "/Applications/Divvy.app"
  register: DIVVY_APP_DIR

- name: Install divvy
  homebrew_cask:
    name: divvy
  when:
    - DIVVY_APP_DIR.stat.exists == false
    - not (devbox_work_mode | default(false) | bool)

- import_tasks: docker.yml
