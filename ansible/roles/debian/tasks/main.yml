---
- name: Install a list of packages
  apt:
    pkg:
    - zsh
    - gnupg2
    - rcm
    - fzf
    - unzip
    - zip
    - hub
    - neovim
    - direnv
  become: true

- name: Ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add GitHub CLI apt key
  apt_key:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    keyring: /etc/apt/keyrings/githubcli-archive-keyring.gpg
  become: true

- name: Add GitHub CLI apt repository
  apt_repository:
    repo: "deb [arch={{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
  become: true

- name: Install GitHub CLI
  apt:
    name: gh
    update_cache: true
  become: true

- user:
    name: "{{ ansible_facts.user_id }}"
    create_home: no
    shell: /usr/bin/zsh
    update_password: on_create
  become: true
